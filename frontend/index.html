<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureAsset API Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>SecureAsset API Demo</h1>
    <div class="container">
      <!-- User Actions -->
      <div class="section">
        <h2>1. User Management</h2>
        <div class="form-group" id="register-form">
          <h3>Register User</h3>
          <input
            type="text"
            id="reg-username"
            placeholder="Username"
            value="testuser"
          />
          <input
            type="email"
            id="reg-email"
            placeholder="Email"
            value="test@example.com"
          />
          <input
            type="password"
            id="reg-password"
            placeholder="Password"
            value="password123"
          />
          <label for="role">Choose a role:</label>

          <select name="role" id="role">
            <option value="Viewer">Viewer</option>
            <option value="Employee">Employee</option>
          </select>
          <label for="department">Department:</label>
          <select name="department" id="department">
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
          </select>
          <button id="register-btn">Register</button>
        </div>
        <div class="form-group" id="login-form">
          <h3>Login User</h3>
          <input
            type="text"
            id="login-identifier"
            placeholder="Email or Username"
          />
          <input type="password" id="login-password" placeholder="Password" />
          <button id="login-btn">Login</button>
        </div>
      </div>

      <!-- Asset Actions -->
      <div class="section">
        <h2>2. Asset Management (Requires Login)</h2>
        <div class="form-group" id="create-asset-form">
          <h3>Create Asset</h3>
          <input
            type="text"
            id="asset-name"
            placeholder="Asset Name"
            value="My New Laptop"
          />
          <input
            type="text"
            id="asset-type"
            placeholder="Asset Type"
            value="Hardware"
          />
          <input
            type="text"
            id="asset-classification"
            placeholder="Classification (e.g., Public, Confidential)"
            value="Confidential"
          />
          <button id="create-asset-btn">Create Asset</button>
        </div>
        <div class="form-group" id="get-asset-form">
          <h3>Get Asset by ID</h3>
          <input type="text" id="get-asset-id" placeholder="Asset ID" />
          <button id="get-asset-btn">Get Asset</button>
        </div>
      </div>
      <div class="section">
        <h2>3. Demonstration Scenarios</h2>
        <p>
          Login as the correct user, then click a button to test a scenario.
        </p>
        <div class="scenarios">
          <button class="scenario-btn" data-test="rbac-employee">
            1. RBAC: Employee creates asset (Should Pass)
          </button>
          <button class="scenario-btn" data-test="rbac-viewer">
            2. RBAC: Viewer creates asset (Should Fail)
          </button>
          <button class="scenario-btn" data-test="mac-viewer">
            3. MAC: Viewer (Confidential) gets TopSecret doc (Should Fail)
          </button>
          <button class="scenario-btn" data-test="abac-viewer">
            4. ABAC: Viewer (Marketing) gets IT server (Should Fail)
          </button>
          <button class="scenario-btn" data-test="dac-viewer">
            5. DAC: Viewer gets report via direct permission (Should Pass)
          </button>
        </div>
      </div>
      <!-- API Response -->
      <div class="section">
        <h2>API Response</h2>
        <div class="response-area">
          <pre id="api-response">Awaiting action...</pre>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
